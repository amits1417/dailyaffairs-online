name: Daily IndiaBIX Current Affairs Auto-Sync

on:
  schedule:
    # 4:00 AM IST (22:30 UTC), 1:00 PM IST (07:30 UTC), 9:00 PM IST (15:30 UTC)
    - cron: '30 7,15,22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-current-affairs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Auto-Sync
        run: node -e "const cronService = require('./services/cron'); (async () => { await cronService.autoSyncLatest(); process.exit(0); })();"

      - name: Commit & Push updated current affairs data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current_affairs.json data/translation_cache.json
          if git diff --staged --quiet; then
            echo "No new current affairs to commit."
          else
            git commit -m "Auto-sync daily current affairs [skip ci]"
            git push
          fi
